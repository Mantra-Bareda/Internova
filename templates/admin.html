<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Internova - Admin Panel</title>
    <link href="https://fonts.googleapis.com/css2?family=Marcellus&family=Josefin+Sans:wght@300;400;600&display=swap" rel="stylesheet">
    <style>
        body {
            background-color: #0A0A0A;
            color: #F2F0E4;
            font-family: 'Josefin Sans', sans-serif;
            padding: 1rem;
        }
        @media (min-width: 768px) {
            body { padding: 2.5rem; }
        }
        h1 {
            font-family: 'Marcellus', serif;
            color: #D4AF37;
            text-transform: uppercase;
            letter-spacing: 0.1em;
            font-size: clamp(1.5rem, 5vw, 2rem);
        }
        .container {
            background: #141414;
            border: 1px solid rgba(212, 175, 55, 0.3);
            padding: 1.5rem;
            border-radius: 0.5rem;
            max-width: 900px;
            margin: 1.25rem auto;
        }
        @media (min-width: 768px) {
            .container { padding: 2rem; }
        }
        .table-responsive {
            overflow-x: auto;
            -webkit-overflow-scrolling: touch;
            margin-top: 1.25rem;
        }
        table {
            width: 100%;
            border-collapse: collapse;
            min-width: 500px;
        }
        th, td {
            border-bottom: 1px solid rgba(212, 175, 55, 0.2);
            padding: 1rem;
            text-align: left;
        }
        th {
            color: #D4AF37;
            text-transform: uppercase;
            font-size: 0.9em;
            letter-spacing: 0.1em;
        }
        input[type="number"] {
            background: transparent;
            color: #F2F0E4;
            border: 1px solid #D4AF37;
            padding: 0.5rem;
            width: 80px;
            font-family: 'Josefin Sans', sans-serif;
            min-height: 44px; /* touch target */
        }
        button {
            background-color: transparent;
            color: #D4AF37;
            border: 1px solid #D4AF37;
            padding: 0.5rem 1rem;
            cursor: pointer;
            transition: all 0.3s;
            font-family: 'Marcellus', serif;
            min-height: 44px; /* touch target */
        }
        button:hover {
            background-color: #D4AF37;
            color: #0A0A0A;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Admin Control Panel</h1>
        <p>Manage user credits for data generations.</p>
        <a href="{{ url_for('dashboard_redirect') }}" style="color: #D4AF37;">&larr; Back to Dashboard</a>
        <span style="float: right; color: #D4AF37; font-weight: bold;">🪙 Credits: {{ current_user.credits }}</span>
        
        <div class="table-responsive">
            <table>
                <tr><th>ID</th><th>Email</th><th>Credits</th><th>Action</th></tr>
                {% for u in users %}
                <tr>
                    <td>{{ u.id }}</td>
                    <td>{{ u.username }}</td>
                    <td><input type="number" id="credits-{{ u.id }}" value="{{ u.credits }}"></td>
                    <td><button onclick="updateCredits({{ u.id }})">Save</button></td>
                </tr>
                {% endfor %}
            </table>
        </div>
    </div>
    <script>
        function updateCredits(userId) {
            const credits = document.getElementById('credits-' + userId).value;
            fetch('{{ url_for("admin_update_credits") }}', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ user_id: userId, credits: credits }) })
            .then(res => res.json()).then(data => { if(data.success) alert('Credits updated successfully!'); else alert('Error updating credits'); });
        }
    </script>
</body>
</html>
